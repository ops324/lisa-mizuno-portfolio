<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 48" width="225" height="48">
  <defs>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f4f4f4"/>
      <stop offset="45%"  stop-color="#d2d2d2"/>
      <stop offset="100%" stop-color="#979797"/>
    </linearGradient>
  </defs>
  <!-- Shield: rounded top, heraldic pointed bottom -->
  <path d="M3,8 Q3,2 9,2 L31,2 Q37,2 37,8 L37,27 Q36,40 20,47 Q4,40 3,27 Z"
        fill="url(#shield-grad)" stroke="#c4c4c4" stroke-width="0.6"/>
  <!-- DOMMUNE wordmark -->
  <text x="45" y="33"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="21" font-weight="700"
        letter-spacing="0.8"
        fill="#111111">DOMMUNE</text>
</svg>
